<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chai aur code</title>
</head>
<body style="background-color:#212121 ;color:white">
  <ul class="language">
    <li>javaScript</li>
    
  </ul>
</body>
<script>
  function addLanguage(langName){
    const li=document.createElement('li');
    li.innerHTML=`${langName}`;
    document.querySelector('.language').appendChild(li)
    
  }
  addLanguage("python")
  addLanguage("java")

  function addOptionalLanguage(langName){
    const li=document.createElement('li');
    li.appendChild(document.createTextNode(langName))
    document.querySelector('.language').appendChild(li)
  }
  //this second method is more optimized cuz add inerHTMl will iterate again and agiain to the main tree, but innerText will not 
  addOptionalLanguage("C++")
  addOptionalLanguage("Ruby")
  const secondlang=document.querySelector("li:nth-child(2)")
  // secondlang.innerHTML="Mojo"
  const newli=document.createElement('li')
  newli.textContent="mojo"
  secondlang.replaceWith(newli)
  // console.log(secondlang);

  //edit
  const firstlang=document.querySelector("li:first-child")
  firstlang.outerHTML='<li>TypeScript</li>'

  //remove
  const lastLang=document.querySelector("li:last-child")
  lastLang.remove()

</script>
</html>
