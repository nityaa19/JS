<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chai aur code</title>
</head>
<body style="background-color:#212121 ;color:white">

</body>
  
<script>
  const div=document.createElement('div')
  // console.log(div);
  div.className="main"
  div.id=Math.round(Math.random()*10+1)
  div.setAttribute("title","generated title")
  div.style.backgroundColor="green"
  div.style.padding="12px"
  //till here div will not visisble to the screen bcz we have not attached it to the children of body or any other element
  // div.innerText="This is a dynamically created div"
  const addText=document.createTextNode("This is a dynamically created text node") //this will create a text node but it will not be visible to the screen bcz we have not attached it to the children of body or any other element
  div.appendChild(addText)

  document.body.appendChild(div)

</script>
</html>
