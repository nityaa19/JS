<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>
    Password Generator
  </h1>
  <form action="\submit">
    <input type="number" placeholder="Length of Pass  (8-15)" id="input-len" >
    <p>Define your Passoword</p>
    <label>
      <input type="checkbox" id="uppercase">
      Uppercase
    </label>

    <label>
      <input type="checkbox" id="lowercase" >
      Lowercase
    </label>

    <label>
      <input type="checkbox" id="numbers">
      Numbers
    </label>

    <label>
      <input type="checkbox" id="symbols">
      Symbols
    </label>
    
    <button id="submit">submit</button>
    
  </form>

  <div id="result"></div>
</body>
<script>
  const form =document.querySelector('form')
  const input=document.querySelector('#input-len')
  const result=document.getElementById('result')

  const upperCase=document.querySelector('#uppercase')
  const lowerCase=document.querySelector('#lowercase')
  const numerical=document.querySelector('#numbers')
  const symbolic=document.querySelector('#symbols')


  // const small="abcdefghijklmnopqrstuv"
  // const capital="ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  // const numbers="0123456789"
  // const symbols="!@#$%&*"

  const table=["ABCDEFGHIJKLMNOPQRSTUVWXYZ","abcdefghijklmnopqrstuv","0123456789","!@#$%&*"]

  function generateRandom(x){
    let res=""
    const len=x.length;
   return x[(Math.floor(Math.random()*len))]
  }
  

  let a=false
  let b=false
  let c=false
  let d=false


  let pass_len
  form.addEventListener('submit',function(e){
    e.preventDefault();
    a=upperCase.checked
    b=lowerCase.checked
    c=numerical.checked
    d=symbolic.checked
    
    if(!a && !b && !c && !d){
      result.innerHTML=`Please select at least one character type.`
    }

    if(input.value>=8 && input.value<=15){
      pass_len=input.value
      generatePass(a,b,c,d,pass_len)
    }else{
      result.innerHTML=`Enter the length of password form 8 to 15`
      
    }
  
    //making the default setting 
    input.value=""
    upperCase.checked=false
    lowerCase.checked=false
    numerical.checked=false
    symbolic.checked=false
  })
  
  

  function generatePass(a,b,c,d,len){
    let ans=""
    let selected=""
    if(a){
      selected+=table[0]
    }
    if(b){
      selected+=table[1]
    }
    if(c){
      selected+=table[2]
    }
    if(d){
      selected+=table[3]
    }
    for(let i=0;i<len;i++){
      ans+=generateRandom(selected)
    }
    document.querySelector('body').innerHTML=`<h1>Generated Passowrd! ${ans}</h1> `
  }
  

</script>
</html>
